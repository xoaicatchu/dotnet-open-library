syntax = "proto3";
option csharp_namespace = "Shared.Contracts";
package product;

service ProductGrpc {
  rpc GetProduct (GetProductRequest) returns (GetProductReply);
  rpc CheckStock (CheckStockRequest) returns (CheckStockReply);
}

message GetProductRequest { int32 id = 1; }
message GetProductReply {
  int32 id = 1;
  string name = 2;
  double price = 3;
  int32 stock = 4;
  bool found = 5;
}
message CheckStockRequest { int32 product_id = 1; int32 quantity = 2; }
message CheckStockReply { bool available = 1; string message = 2; }
